<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תצוגה חיה — סוכן הדואר</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Heebo', 'Segoe UI', sans-serif;
      background: #f3f5f9;
      color: #202124;
      font-size: 15px;
      min-height: 100vh;
    }
    .navbar { background: linear-gradient(135deg, #1e40af, #3b82f6) !important; }
    .navbar-brand { font-weight: 700; }

    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #9aa0a6;
      margin-inline-start: 6px;
      vertical-align: middle;
      transition: background-color .25s ease;
    }
    .status-dot.running { background: #34a853; box-shadow: 0 0 0 4px rgba(52,168,83,.18); animation: pulseDot 1.6s infinite; }
    .status-dot.quota_breaker { background: #ea4335; box-shadow: 0 0 0 4px rgba(234,67,53,.18); }
    .status-dot.paused { background: #fbbc04; }
    .status-dot.err { background: #ea4335; }

    @keyframes pulseDot {
      0%, 100% { box-shadow: 0 0 0 4px rgba(52,168,83,.18); }
      50% { box-shadow: 0 0 0 8px rgba(52,168,83,.04); }
    }

    .controls-bar {
      background: #fff;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.08);
      margin-bottom: 1rem;
    }

    #event-feed {
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding-inline-end: 4px;
    }
    #event-feed::-webkit-scrollbar { width: 8px; }
    #event-feed::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .event-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.08);
      padding: 0.85rem 1rem;
      margin-bottom: 0.6rem;
      border-inline-start: 4px solid #9aa0a6;
      transition: background-color .25s ease;
      cursor: pointer;
    }
    .event-card:hover { background: #f9fbfd; }
    .event-card.k-process { border-color: #1a73e8; }
    .event-card.k-draft_created { border-color: #34a853; }
    .event-card.k-trigger_fired { border-color: #9aa0a6; }
    .event-card.k-error { border-color: #ea4335; background: #fef7f6; }
    .event-card.k-urgent { border-color: #f97316; background: #fff8f1; }

    .event-card.is-new { animation: flashIn 1.6s ease-out; }
    @keyframes flashIn {
      0% { background: #e8f5ff; transform: translateY(-6px); opacity: 0; }
      100% { background: #fff; transform: translateY(0); opacity: 1; }
    }
    .event-card.k-error.is-new { animation-name: flashInErr; }
    @keyframes flashInErr {
      0% { background: #fde7e5; transform: translateY(-6px); opacity: 0; }
      100% { background: #fef7f6; transform: translateY(0); opacity: 1; }
    }

    .event-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 0.25rem;
    }
    .event-kind {
      display: inline-block;
      font-weight: 600;
      font-size: 0.72rem;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      background: #eef2f7;
      color: #475569;
    }
    .event-kind.k-process { background: #dceafd; color: #1a73e8; }
    .event-kind.k-draft_created { background: #d8f0e1; color: #1e7e3e; }
    .event-kind.k-trigger_fired { background: #e2e5ea; color: #475569; }
    .event-kind.k-error { background: #fcd9d6; color: #b91c1c; }
    .event-kind.k-urgent { background: #ffe1c8; color: #c2410c; }

    .event-summary { font-weight: 500; line-height: 1.45; }
    .event-details {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px dashed #e5e7eb;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .event-card.expanded .event-details { display: block; }

    .empty-state {
      text-align: center;
      color: #9aa0a6;
      padding: 3rem 1rem;
    }
    .empty-state i { font-size: 3rem; opacity: .4; }

    #token-prompt { display: none; }

    .live-stat {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fff;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.82rem;
      color: #475569;
      border: 1px solid #e5e7eb;
    }
    .live-stat strong { color: #1e293b; font-weight: 600; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="bi bi-broadcast ms-2"></i>
      תצוגה חיה — סוכן הדואר
    </a>
    <div class="d-flex align-items-center text-white-50 small">
      <a href="index.html" class="text-white-50 text-decoration-none me-3">
        <i class="bi bi-speedometer2 ms-1"></i>חזרה ללוח
      </a>
      <span class="me-3">
        <span id="agent-status-label">טוען</span>
        <span id="agent-status-dot" class="status-dot"></span>
      </span>
    </div>
  </div>
</nav>

<div id="token-prompt" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-3"><i class="bi bi-key ms-2"></i>הזנת אסימון גישה</h4>
          <p class="text-muted small mb-3">הזן את אסימון הגישה לסוכן. האסימון יישמר ב localStorage של הדפדפן.</p>
          <div class="input-group">
            <input type="password" id="token-input" class="form-control" placeholder="אסימון">
            <button class="btn btn-primary" id="token-save">שמור</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<main id="live-main" class="container-fluid p-3 p-md-4">

  <div class="controls-bar d-flex flex-wrap align-items-center gap-2">
    <button id="btn-pause" class="btn btn-sm btn-outline-warning">
      <i class="bi bi-pause-fill ms-1"></i><span id="btn-pause-label">השהה</span>
    </button>
    <div class="form-check form-switch m-0 me-2">
      <input class="form-check-input" type="checkbox" id="toggle-autoscroll" checked>
      <label class="form-check-label small" for="toggle-autoscroll">גלילה אוטומטית למעלה</label>
    </div>
    <button id="btn-refresh" class="btn btn-sm btn-outline-primary">
      <i class="bi bi-arrow-clockwise ms-1"></i>רענון מיידי
    </button>
    <button id="btn-clear-feed" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-eraser ms-1"></i>נקה תצוגה
    </button>
    <span class="ms-auto d-flex align-items-center gap-2 flex-wrap">
      <span class="live-stat"><i class="bi bi-list-ul"></i>אירועים: <strong id="stat-count">0</strong></span>
      <span class="live-stat"><i class="bi bi-envelope"></i>מכסה: <strong id="stat-quota">—</strong></span>
      <span class="live-stat"><i class="bi bi-telephone"></i>ימות: <strong id="stat-yemot">—</strong></span>
      <span class="live-stat"><i class="bi bi-clock"></i>עדכון: <strong id="stat-last">—</strong></span>
    </span>
  </div>

  <div id="event-feed">
    <div class="empty-state" id="empty-state">
      <i class="bi bi-broadcast"></i>
      <div class="mt-2">ממתין לאירועים...</div>
    </div>
  </div>

  <footer class="text-center text-muted small py-3">
    <span>קצב סקירה: כל 3 שניות</span>
    <span class="mx-2">·</span>
    <a href="#" id="link-clear-token" class="text-muted">החלף אסימון</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
  'use strict';

  var WEBHOOK_BASE = 'https://script.google.com/macros/s/AKfycbzhRqTLE4fjjDqrH1we-JlGZ15R-ws8b_gfWF1xF1ewailaiyiS_YXqUhRtb3cQghVt/exec';
  var POLL_MS = 3000;
  var TOKEN_KEY = 'aiAgentToken';
  var MAX_FEED = 200;

  var state = {
    paused: false,
    autoscroll: true,
    seen: Object.create(null),
    firstFetch: true,
    feed: [],
    timer: null,
  };

  // ----- token handling -----------------------------------------------------
  function getToken() {
    var url = new URL(window.location.href);
    var fromUrl = url.searchParams.get('token');
    if (fromUrl) {
      try { localStorage.setItem(TOKEN_KEY, fromUrl); } catch (_) {}
      return fromUrl;
    }
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (_) { return ''; }
  }

  function clearToken() {
    try { localStorage.removeItem(TOKEN_KEY); } catch (_) {}
    location.reload();
  }

  function setupTokenPrompt() {
    document.getElementById('token-prompt').style.display = 'block';
    document.getElementById('live-main').style.display = 'none';
    document.getElementById('token-save').onclick = function () {
      var v = document.getElementById('token-input').value.trim();
      if (!v) return;
      try { localStorage.setItem(TOKEN_KEY, v); } catch (_) {}
      location.reload();
    };
    document.getElementById('token-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('token-save').click();
    });
  }

  // ----- helpers ------------------------------------------------------------
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function formatTs(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso).substring(0, 19);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    var ss = String(d.getSeconds()).padStart(2, '0');
    if (sameDay) return hh + ':' + mm + ':' + ss;
    var dd = String(d.getDate()).padStart(2, '0');
    var mo = String(d.getMonth() + 1).padStart(2, '0');
    return dd + '/' + mo + ' ' + hh + ':' + mm;
  }

  function kindLabel(k) {
    switch (k) {
      case 'process': return 'עיבוד';
      case 'draft_created': return 'טיוטה';
      case 'trigger_fired': return 'טריגר';
      case 'error': return 'שגיאה';
      case 'urgent': return 'דחוף';
      default: return k || 'אחר';
    }
  }

  // Stable event signature for de-dup across polls.
  function eventKey(ev) {
    return (ev.ts || '') + '|' + (ev.kind || '') + '|' + (ev.summary || '');
  }

  // ----- API ----------------------------------------------------------------
  function fetchTail() {
    var token = getToken();
    if (!token) {
      setupTokenPrompt();
      return Promise.reject(new Error('missing-token'));
    }
    var url = WEBHOOK_BASE + '?action=tail&limit=50&token=' + encodeURIComponent(token);
    return fetch(url, { method: 'GET', mode: 'cors' })
      .then(function (r) {
        if (!r.ok) throw new Error('http-' + r.status);
        return r.json();
      });
  }

  // ----- rendering ----------------------------------------------------------
  function setStatus(s) {
    var dot = document.getElementById('agent-status-dot');
    var lbl = document.getElementById('agent-status-label');
    dot.className = 'status-dot ' + s;
    var labels = {
      running: 'פעיל',
      quota_breaker: 'מכסה חסומה',
      paused: 'מושהה',
      err: 'שגיאה',
      loading: 'טוען',
    };
    lbl.textContent = labels[s] || s;
  }

  function renderEvent(ev, isNew) {
    var kClass = 'k-' + (ev.kind || 'process');
    var newCls = isNew ? ' is-new' : '';
    var detailsId = 'd-' + Math.random().toString(36).substring(2, 9);
    return (
      '<div class="event-card ' + kClass + newCls + '" data-key="' + escapeHtml(eventKey(ev)) + '">' +
        '<div class="event-meta">' +
          '<span class="event-kind ' + kClass + '">' + escapeHtml(kindLabel(ev.kind)) + '</span>' +
          '<span title="' + escapeHtml(ev.ts || '') + '">' + escapeHtml(formatTs(ev.ts)) + '</span>' +
        '</div>' +
        '<div class="event-summary">' + escapeHtml(ev.summary || '') + '</div>' +
        (ev.details ? '<div class="event-details" id="' + detailsId + '">' + escapeHtml(ev.details) + '</div>' : '') +
      '</div>'
    );
  }

  function rebuildFeed() {
    var feed = document.getElementById('event-feed');
    var empty = document.getElementById('empty-state');
    if (!state.feed.length) {
      feed.innerHTML = '';
      feed.appendChild(empty);
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    var html = state.feed.map(function (entry) {
      return renderEvent(entry.ev, entry.isNew);
    }).join('');
    feed.innerHTML = html;
    // Wire click-to-expand
    Array.prototype.forEach.call(feed.querySelectorAll('.event-card'), function (el) {
      el.addEventListener('click', function () {
        el.classList.toggle('expanded');
      });
    });
  }

  function applyResponse(resp) {
    if (!resp || !resp.ok) {
      setStatus('err');
      return;
    }
    setStatus(resp.agent_status || 'running');
    document.getElementById('stat-quota').textContent =
      resp.mail_remaining != null && resp.mail_remaining >= 0 ? resp.mail_remaining : '—';
    document.getElementById('stat-yemot').textContent =
      resp.yemot_processed != null ? resp.yemot_processed : '—';
    document.getElementById('stat-last').textContent = formatTs(resp.now);

    var events = resp.events || [];
    var newOnes = [];
    events.forEach(function (ev) {
      var k = eventKey(ev);
      if (state.seen[k]) return;
      state.seen[k] = 1;
      newOnes.push(ev);
    });

    if (newOnes.length) {
      // Newest first — events are already sorted desc by server, but we
      // ensure local ordering is consistent.
      newOnes.sort(function (a, b) {
        return (Date.parse(b.ts || '') || 0) - (Date.parse(a.ts || '') || 0);
      });
      // First fetch ever — render WITHOUT the "new" flash so we don't blink
      // 50 cards on page load.
      var markNew = !state.firstFetch;
      newOnes.forEach(function (ev) {
        state.feed.unshift({ ev: ev, isNew: markNew });
      });
      // Cap memory
      if (state.feed.length > MAX_FEED) state.feed = state.feed.slice(0, MAX_FEED);
      rebuildFeed();

      if (state.autoscroll) {
        document.getElementById('event-feed').scrollTop = 0;
      }
      // Clear the new-flag after animation so a refresh doesn't re-flash
      setTimeout(function () {
        state.feed.forEach(function (e) { e.isNew = false; });
      }, 1800);
    }

    document.getElementById('stat-count').textContent = state.feed.length;
    state.firstFetch = false;
  }

  // ----- polling loop -------------------------------------------------------
  function tick() {
    if (state.paused) return;
    fetchTail()
      .then(applyResponse)
      .catch(function (e) {
        if (e && e.message === 'missing-token') return;
        setStatus('err');
        console.warn('tail error:', e && e.message);
      });
  }

  function startPolling() {
    if (state.timer) return;
    tick();
    state.timer = setInterval(tick, POLL_MS);
  }

  function stopPolling() {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
  }

  // ----- UI wiring ----------------------------------------------------------
  function wireUi() {
    document.getElementById('btn-pause').addEventListener('click', function () {
      state.paused = !state.paused;
      var lbl = document.getElementById('btn-pause-label');
      var btn = document.getElementById('btn-pause');
      if (state.paused) {
        lbl.textContent = 'המשך';
        btn.classList.remove('btn-outline-warning');
        btn.classList.add('btn-warning');
        btn.querySelector('i').className = 'bi bi-play-fill ms-1';
        setStatus('paused');
      } else {
        lbl.textContent = 'השהה';
        btn.classList.remove('btn-warning');
        btn.classList.add('btn-outline-warning');
        btn.querySelector('i').className = 'bi bi-pause-fill ms-1';
        setStatus('loading');
        tick();
      }
    });

    document.getElementById('toggle-autoscroll').addEventListener('change', function (e) {
      state.autoscroll = !!e.target.checked;
    });

    document.getElementById('btn-refresh').addEventListener('click', function () {
      tick();
    });

    document.getElementById('btn-clear-feed').addEventListener('click', function () {
      state.feed = [];
      state.seen = Object.create(null);
      state.firstFetch = true;
      document.getElementById('stat-count').textContent = 0;
      rebuildFeed();
    });

    document.getElementById('link-clear-token').addEventListener('click', function (e) {
      e.preventDefault();
      clearToken();
    });

    // Pause polling when tab is hidden — saves quota and bandwidth.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        stopPolling();
      } else if (!state.paused) {
        startPolling();
      }
    });
  }

  // ----- boot ---------------------------------------------------------------
  function boot() {
    if (!getToken()) { setupTokenPrompt(); return; }
    setStatus('loading');
    wireUi();
    startPolling();
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
